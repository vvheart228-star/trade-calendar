'use strict';const $=id=>document.getElementById(id),editor=$('editor'),form=$('form');const KEY='trade-calendar-v1';let data={trades:[],currency:'USD'},storageError=false;try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.trades))data=x}catch(e){storageError=true}const localDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;let selected=localDate(new Date()),view=new Date(selected+'T12:00:00'),tab=0,editing=null;const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:data.currency||'USD',signDisplay:'exceptZero',maximumFractionDigits:2}).format(n/100);const total=a=>a.reduce((s,t)=>s+t.pnl,0);const cls=n=>n>0?'pos':n<0?'neg':'';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(next){try{localStorage.setItem(KEY,JSON.stringify(next));data=next;return true}catch(e){alert('Не удалось сохранить данные. Проверьте настройки хранилища Safari.');return false}}const monthKey=()=>localDate(new Date(view.getFullYear(),view.getMonth(),1)).slice(0,7);const monthTrades=()=>data.trades.filter(t=>t.date.startsWith(monthKey()));const dayTrades=()=>data.trades.filter(t=>t.date===selected);const dateLabel=s=>new Date(s+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});function stats(a){let wins=a.filter(t=>t.pnl>0).length,losses=a.filter(t=>t.pnl<0).length;return {wins,losses,rate:wins+losses?Math.round(wins/(wins+losses)*100):0,days:new Set(a.map(t=>t.date)).size}}function summary(a){let s=stats(a);return `<section class="panel hero"><div class="hero-label"><small>Результат за месяц</small><span class="live">Журнал</span></div><div class="big ${cls(total(a))}">${money(total(a))}</div><div class="stats"><div><small>Сделки</small><b>${a.length}</b></div><div><small>Win rate</small><b>${s.rate}%</b></div><div><small>Дни</small><b>${s.days}</b></div></div></section>`}function trades(a){if(!a.length)return '<div class="empty">Сделок пока нет</div>';return [...a].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).map(t=>`<article class="trade"><div class="row"><div class="wrap"><b>${esc(t.symbol)} · ${esc(t.side)}</b><div class="tag">${esc(dateLabel(t.date))} ${esc(t.time)}</div></div><b class="amount ${cls(t.pnl)}">${money(t.pnl)}</b></div>${t.entry||t.exit?`<p>Вход: ${esc(t.entry||'—')} · Выход: ${esc(t.exit||'—')}</p>`:''}${t.note?`<p>${esc(t.note)}</p>`:''}<div class="actions"><button data-edit="${esc(t.id)}">Изменить</button><button class="danger" data-delete="${esc(t.id)}">Удалить</button></div></article>`).join('')}const crown='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 6l5 4 5-7 5 7 5-4-3 12H5L2 6zm3 14h14v2H5z"/></svg>';function bestDays(a){const sums=new Map();for(const t of a)sums.set(t.date,(sums.get(t.date)||0)+t.pnl);const max=Math.max(0,...sums.values());return {pnl:max,dates:max>0?[...sums].filter(([,v])=>v===max).map(([d])=>d).sort():[]}}function calendar(){let y=view.getFullYear(),m=view.getMonth(),offset=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),a=monthTrades(),best=bestDays(a);let grid=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="weekday">${x}</div>`).join('')+'<div></div>'.repeat(offset);for(let d=1;d<=n;d++){let key=localDate(new Date(y,m,d)),ts=a.filter(t=>t.date===key),p=total(ts),top=best.dates.includes(key);grid+=`<button class="day ${ts.length?p>0?'win':p<0?'loss':'even':''} ${top?'best':''} ${selected===key?'selected':''} ${key===localDate(new Date())?'today':''}" data-day="${key}" aria-pressed="${selected===key}" aria-label="${dateLabel(key)}, ${ts.length} сделок, ${money(p)}${top?', лучший день месяца':''}">${top?crown.replace('<svg','<svg class="crown"'):''}<span>${d}</span>${ts.length?`<small>${money(p)}</small>`:''}</button>`}let record=best.dates.length?`<button class="best-summary" data-day="${best.dates[0]}"><span class="best-icon">${crown}</span><span class="best-text"><b>${best.dates.length>1?'Лучшие дни месяца':'Лучший день месяца'}</b><small>${best.dates.length>1?best.dates.length+' дня с равным результатом':dateLabel(best.dates[0])}</small></span><strong>${money(best.pnl)}</strong></button>`:'';return summary(a)+`<section class="panel"><div class="row"><button data-month="-1" aria-label="Предыдущий месяц">‹</button><b class="month-title">${view.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</b><button data-month="1" aria-label="Следующий месяц">›</button></div><div class="grid">${grid}</div><div class="legend"><span class="pos">● Прибыль</span><span class="neg">● Убыток</span><span>● Без сделок</span><span class="gold">◆ Рекорд</span></div>${record}</section><section class="panel day-detail"><div class="row"><b>${dateLabel(selected)}</b><b class="${cls(total(dayTrades()))}">${money(total(dayTrades()))}</b></div>${trades(dayTrades())}<button class="primary" data-add>＋ Добавить сделку</button></section>`}function analytics(){let a=monthTrades(),s=stats(a),profit=total(a.filter(t=>t.pnl>0)),loss=-total(a.filter(t=>t.pnl<0)),days=Array.from(new Set(a.map(t=>t.date))).sort(),running=0,points=[0,...days.map(d=>running+=total(a.filter(t=>t.date===d)))],lo=Math.min(...points,0),hi=Math.max(...points,0),coords=points.map((p,i)=>`${12+i*296/Math.max(points.length-1,1)},${104-(p-lo)*90/Math.max(hi-lo,1)}`).join(' ');return summary(a)+`<section class="panel"><div class="row"><button data-month="-1">‹</button><b>${view.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</b><button data-month="1">›</button></div><h2 style="margin-top:20px">Накопленный результат</h2><svg class="plot" viewBox="0 0 320 120" role="img" aria-label="График накопленного результата"><path d="M12 104H308 M12 59H308 M12 14H308" stroke="#354239" fill="none"/><polyline points="${coords}" fill="none" stroke="#65e3a8" stroke-width="2.5" stroke-linejoin="round"/></svg><div class="row"><small>Начало месяца</small><b class="${cls(total(a))}">${money(total(a))}</b></div></section><section class="panel"><h2>Эффективность</h2><div class="row"><span>Прибыльные: ${s.wins}</span><span>Убыточные: ${s.losses}</span></div><div class="bar"><span style="width:${s.rate}%"></span></div><div class="trade row"><span>Валовая прибыль</span><b class="pos">${money(profit)}</b></div><div class="trade row"><span>Валовый убыток</span><b class="neg">${money(-loss)}</b></div><div class="trade row"><span>Profit factor</span><b>${loss?(profit/loss).toFixed(2):profit?'∞':'—'}</b></div><div class="trade row"><span>Средняя сделка</span><b>${money(a.length?Math.round(total(a)/a.length):0)}</b></div></section>`}const icons=['<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18m-13 4h2m4 0h2m-8 3h2"/>','<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6m-6 4h6m-6 4h4"/>','<path d="M4 20h16M7 16v-5m5 5V4m5 12V8"/>','<circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/>'];function render(){ $('nav').innerHTML=['Календарь','Журнал','Статистика','Настройки'].map((s,i)=>`<button data-tab="${i}" class="${i===tab?'active':''}"><svg viewBox="0 0 24 24">${icons[i]}</svg>${s}</button>`).join('');$('content').innerHTML=(storageError?'<p id="notice">Не удалось прочитать локальное хранилище.</p>':'')+(tab===0?calendar():tab===1?`<section class="panel"><h2>Все сделки · ${data.trades.length}</h2><button class="primary" data-add>＋ Добавить сделку</button>${trades(data.trades)}</section>`:tab===2?analytics():`<section class="panel"><h2>Настройки</h2><label for="currency">Валюта журнала</label><select id="currency">${['USD','EUR','RUB','SEK','GBP'].map(c=>`<option ${c===data.currency?'selected':''}>${c}</option>`).join('')}</select><p class="muted">Валюта меняет обозначение, но не конвертирует суммы. Все сделки должны быть в одной валюте.</p></section><section class="panel"><h2>Резервная копия</h2><p class="muted">Данные хранятся только на этом устройстве. Экспортируйте резервную копию перед очисткой Safari или сменой телефона.</p><button class="primary" id="export">Экспорт JSON</button><button style="width:100%;margin-top:10px" id="import">Импорт JSON</button></section><section class="panel"><h2>Установка на iPhone</h2><p class="muted">Откройте сайт в Safari → Поделиться → На экран «Домой».</p></section>`)}function openTrade(t){editing=t?.id||null;form.reset();$('formTitle').textContent=t?'Редактирование':'Новая сделка';$('date').value=t?.date||selected;$('time').value=t?.time||new Date().toTimeString().slice(0,5);$('symbol').value=t?.symbol||'XAUUSD';$('side').value=t?.side||'LONG';$('outcome').value=t?t.pnl>0?'win':t.pnl<0?'loss':'even':'win';$('amount').value=t?(Math.abs(t.pnl)/100).toFixed(2).replace('.',','):'';$('entry').value=t?.entry||'';$('exit').value=t?.exit||'';$('note').value=t?.note||'';syncOutcome();editor.showModal()}function syncOutcome(){let even=$('outcome').value==='even';$('amount').disabled=even;if(even)$('amount').value=0}$('outcome').onchange=syncOutcome;function parseAmountCents(raw){
  const value=String(raw).trim();

form.onsubmit=e=>{e.preventDefault();const cents=$('outcome').value==='even'?0:parseAmountCents($('amount').value);if(cents===null){alert('Введите корректную сумму: например, 12,50 или 12.50. Не более двух знаков после запятой.');$('amount').focus();return;}const pnl=cents*($('outcome').value==='loss'?-1:1);if(!Number.isSafeInteger(pnl)||!$('symbol').value.trim())return;let t={id:editing||globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2),date:$('date').value,time:$('time').value,symbol:$('symbol').value.trim().toUpperCase(),side:$('side').value,pnl,entry:$('entry').value.trim(),exit:$('exit').value.trim(),note:$('note').value.trim()};let next={...data,trades:[...data.trades.filter(x=>x.id!==t.id),t]};if(persist(next)){selected=t.date;view=new Date(selected+'T12:00:00');editor.close();render()}};document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.tab!==undefined){tab=+d.tab;render();window.scrollTo(0,0)}else if(d.month){view=new Date(view.getFullYear(),view.getMonth()+Number(d.month),1);selected=localDate(view);render()}else if(d.day){selected=d.day;render();document.querySelector('.day-detail')?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'nearest'})}else if(d.add!==undefined)openTrade();else if(d.edit)openTrade(data.trades.find(t=>t.id===d.edit));else if(d.delete&&confirm('Удалить эту сделку?')){if(persist({...data,trades:data.trades.filter(t=>t.id!==d.delete)}))render()}else if(b.id==='export'){let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='trade-calendar-'+localDate(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}else if(b.id==='import')$('importFile').click()});document.addEventListener('change',e=>{if(e.target.id==='currency'){if(persist({...data,currency:e.target.value}))render()}});$('importFile').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;let x=JSON.parse(await f.text());if(!Array.isArray(x.trades)||!['USD','EUR','RUB','SEK','GBP'].includes(x.currency)||!x.trades.every(t=>typeof t.id==='string'&&/^[\w-]+$/.test(t.id)&&/^\d{4}-\d{2}-\d{2}$/.test(t.date)&&!isNaN(new Date(t.date+'T12:00:00'))&&typeof t.symbol==='string'&&['LONG','SHORT'].includes(t.side)&&Number.isSafeInteger(t.pnl))||new Set(x.trades.map(t=>t.id)).size!==x.trades.length)throw Error();if(confirm('Заменить текущие сделки данными из резервной копии?')&&persist(x))render()}catch(e){alert('Некорректный файл резервной копии.')}finally{$('importFile').value=''}};render();setInterval(()=>{if(document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;document.body.classList.add('shine');setTimeout(()=>document.body.classList.remove('shine'),2200)},60000);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
